global:
  only_players: "&cThis command can only be executed by a player."
  no_permission: "&cYou don't have permission to execute this command."
  player_not_found: "&cPlayer not found."
  invalid_number: "&cInvalid number."

chat_cmd:
  usage:
    - "&#a78bfa&lGL&#eeeeee&lChat"
    - ""
    - "&#eeeeee» &#a78bfa/chat on &#eeeeee- Enable the chat."
    - "&#eeeeee» &#a78bfa/chat off &#eeeeee- Disable the chat."
    - "&#eeeeee» &#a78bfa/chat toggle &#eeeeee- Toggle the chat state."
    - "&#eeeeee» &#a78bfa/chat status &#eeeeee- Show the current chat state."
    - "&#eeeeee» &#a78bfa/chat clear &#eeeeee- Clear the chat for everyone."
    - "&#eeeeee» &#a78bfa/chat delay <seconds> &#eeeeee- Set the delay between messages."
    - "&#eeeeee» &#a78bfa/chat reload &#eeeeee- Reload the configuration."
    - ""
  enabled: "&aThe chat has been &lenabled&a."
  disabled: "&cThe chat has been &ldisabled&c."
  already_enabled: "&cThe chat is already enabled."
  already_disabled: "&cThe chat is already disabled."
  chat_disabled: "&cThe chat is disabled."
  status: "&7Chat state: %status%"
  status_on: "&aEnabled"
  status_off: "&cDisabled"
  cleared_sender: "&aChat cleared successfully."
  cleared: "&7%player% &ahas cleared the chat."
  delay_usage: "&cUsage: /chat delay <seconds>"
  delay_set: "&aChat delay set to &f%seconds% &aseconds."
  delay_module_disabled: "&cThe 'chat-cooldown' module is disabled, so this setting would do nothing."
  reloaded: "&aConfiguration reloaded."
  reload_failed: "&cReload failed. Check the console for details."

commandspy_cmd:
  usage:
    - "&#eeeeee» &#a78bfa/commandspy &#eeeeee- Toggle your command spy output."
  enabled: "&aCommand spy &lenabled&a."
  disabled: "&cCommand spy &ldisabled&c."

msg_cmd:
  usage:
    - "&#eeeeee» &#a78bfa/msg <player> <message> &#eeeeee- Send a private message."
  cannot_message_self: "&cYou cannot send a message to yourself."
  blocked_by_target: "&cThat player is ignoring you."

reply_cmd:
  usage:
    - "&#eeeeee» &#a78bfa/reply <message> &#eeeeee- Reply to the last private message."
  no_target: "&cYou have nobody to reply to."

ignore_cmd:
  usage:
    - "&#eeeeee» &#a78bfa/ignore add <player> &#eeeeee- Ignore a player's private messages."
    - "&#eeeeee» &#a78bfa/ignore remove <player> &#eeeeee- Stop ignoring a player."
    - "&#eeeeee» &#a78bfa/ignore list &#eeeeee- List the players you are ignoring."
  usage_add: "&cUsage: /ignore add <player>"
  usage_remove: "&cUsage: /ignore remove <player>"
  cannot_ignore_self: "&cYou cannot ignore yourself."
  already_ignored: "&cYou are already ignoring &f%target%&c."
  not_ignored: "&cYou are not ignoring &f%target%&c."
  added: "&aYou are now ignoring &f%target%&a."
  removed: "&aYou are no longer ignoring &f%target%&a."
  list_empty: "&7You are not ignoring anyone."
  list_header: "&7Ignored players (&f%count%&7):"
  list_entry: "&7- &f%target%"
